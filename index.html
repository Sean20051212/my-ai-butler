<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>AI Butler Vision Container</title>
    <style>
        body { margin: 0; background: transparent; overflow: hidden; font-family: "Microsoft JhengHei", sans-serif; }
        canvas { display: block; width: 100vw; height: 100vh; position: absolute; z-index: 1; }
        #drag-zone { position: absolute; top: 0; left: 0; width: 100vw; height: calc(100vh - 100px); z-index: 5; cursor: move; }
        #chat-container { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 10; display: flex; flex-direction: column; align-items: center; width: 80%; }
        #dialogue-box { background: rgba(0, 0, 0, 0.6); color: white; padding: 15px; border-radius: 10px; margin-bottom: 10px; width: 100%; text-align: center; font-size: 16px; display: none; text-shadow: 1px 1px 2px black; }
        #input-area { display: flex; width: 100%; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        #user-input { flex-grow: 1; padding: 10px; border-radius: 5px 0 0 5px; border: none; outline: none; background: rgba(255, 255, 255, 0.9); }
        #send-btn { padding: 10px 20px; border: none; background: #ff7675; color: white; font-weight: bold; border-radius: 0 5px 5px 0; cursor: pointer; transition: background 0.2s; }
        #send-btn:hover { background: #d63031; }
    </style>
</head>
<body>
    <div id="drag-zone"></div>
    
    <script src="pixi.v8.min.js"></script>
    <script src="pixi-sound.min.js"></script>
    <script src="live2dcubismcore.min.js"></script>
    <script src="live2d-engine.min.js"></script>
    
    <div id="chat-container">
        <div id="dialogue-box"></div>
        <div id="input-area">
            <input type="text" id="user-input" placeholder="說點什麼吧..." autocomplete="off">
            <button id="send-btn">發送</button>
        </div>
    </div>

    <script>
        const Live2DModel = window.PIXI?.live2d?.Live2DModel || window.Live2DModel;
        let live2dModel = null;

        // 可即時調整的鏡頭參數。zoom：相對「完整入鏡」的倍數（1=整個模型剛好入鏡，
        // 放大看臉可用 2~3）；x/y：模型在畫面上的位置(0..1)。
        // 除錯時可在 DevTools Console 直接呼叫：frameModel({ zoom: 2.5, y: 0.9 })
        let fitScale = 1;
        const camera = { zoom: 2.5, x: 0.5, y: 1 };   // 日常預設：上半身特寫

        function applyCamera() {
            if (!live2dModel) return;
            live2dModel.anchor.set(0.5, 0.5);
            live2dModel.scale.set(1);
            fitScale = Math.min(window.innerWidth / live2dModel.width,
                                window.innerHeight / live2dModel.height) * 0.95;
            live2dModel.scale.set(fitScale * camera.zoom);
            live2dModel.x = window.innerWidth * camera.x;
            live2dModel.y = window.innerHeight * camera.y;
        }
        window.frameModel = (opts = {}) => {
            Object.assign(camera, opts);
            applyCamera();
            console.log('camera=', JSON.stringify(camera));
        };

        // 凝視方向，直接餵 focusController 的正規化座標 [-1,1]，與視窗大小/位置無關。
        // (0,0)=中性；nx 正=右、ny 正=下。除錯時可在 Console 呼叫：lookAt(0.3, 0.2)
        const gaze = { nx: 0, ny: 0 };
        window.lookAt = (nx = 0, ny = 0) => {
            gaze.nx = nx; gaze.ny = ny;
            const fc = live2dModel && live2dModel.internalModel && live2dModel.internalModel.focusController;
            if (!fc || typeof fc.focus !== 'function') {
                console.warn('focusController.focus 不存在，無法調整凝視');
                return;
            }
            fc.focus(nx, ny);
            console.log('gaze=', JSON.stringify(gaze));
        };

        async function init() {
            if (!Live2DModel) return;

            // PixiJS v8: Application options go to init(), which is async.
            const app = new PIXI.Application();
            await app.init({ resizeTo: window, backgroundAlpha: 0, antialias: true });
            document.body.appendChild(app.canvas);

            try {
                // untitled-pixi-live2d-engine auto-enables high-precision masks,
                // so this Cubism 5 model's 20+ clipping masks render correctly.
                const modelPath = "./model/Furina/furina.model3.json";
                live2dModel = await Live2DModel.from(modelPath);
                app.stage.addChild(live2dModel);

                // 關掉引擎內建的滑鼠追蹤（座標有 bug、又被拖曳區擋住），改用下方 IPC 版
                try { live2dModel.autoInteract = false; } catch (e) {}
                try { live2dModel.eventMode = 'none'; live2dModel.interactive = false; } catch (e) {}

                // 完整入鏡（fit-to-view），確保臉不會被切掉
                applyCamera();
                window.addEventListener('resize', applyCamera);

                // Ctrl+滾輪 縮放視窗（交給 main process 做 setSize）
                window.addEventListener('wheel', (e) => {
                    if (!e.ctrlKey) return;
                    e.preventDefault();
                    const factor = e.deltaY < 0 ? 1.05 : 0.95;
                    try { require('electron').ipcRenderer.send('resize-window', factor); } catch (err) {}
                }, { passive: false });

                // 手動拖曳視窗：在拖曳區按下左鍵 → 交給 main 跟著游標移動視窗
                const dragZone = document.getElementById('drag-zone');
                if (dragZone) {
                    dragZone.addEventListener('mousedown', (e) => {
                        if (e.button !== 0) return;
                        try { require('electron').ipcRenderer.send('drag-start'); } catch (err) {}
                    });
                    window.addEventListener('mouseup', () => {
                        try { require('electron').ipcRenderer.send('drag-end'); } catch (err) {}
                    });
                }

                // 視線追隨滑鼠：main process 每 33ms 送來「游標相對視窗的正規化座標」，
                // 餵給 focusController。這樣即使滑鼠在拖曳區或視窗外也能正確追蹤。
                try {
                    require('electron').ipcRenderer.on('cursor', (_e, p) => {
                        const fc = live2dModel && live2dModel.internalModel && live2dModel.internalModel.focusController;
                        if (fc) fc.focus(Math.max(-1, Math.min(1, p.nx)), Math.max(-1, Math.min(1, p.ny)));
                    });
                } catch (e) { console.warn('游標 IPC 追蹤不可用:', e && e.message); }

            } catch (e) {
                console.error("模型加載失敗:", e);
                dialogBox.style.display = 'block';
                dialogBox.innerText = "模型載入失敗：" + (e && e.stack ? e.stack : (e && e.message ? e.message : e));
            }
        }
        
        const inputField = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');
        const dialogBox = document.getElementById('dialogue-box');

        let currentAudioUrl = null;

        // ── WebSocket 傳輸 ──────────────────────────────────────────────
        // 取代原本一次性的 POST /chat。持久連線才能做「串流多段語音」與
        // 「講話中被打斷」。斷線會自動重連。
        const WS_URL = 'ws://127.0.0.1:8000/ws';
        let ws = null;
        let wsReady = false;

        function connectWS() {
            ws = new WebSocket(WS_URL);
            ws.onopen = () => { wsReady = true; console.log('WS 已連線'); };
            ws.onclose = () => { wsReady = false; setTimeout(connectWS, 1000); };
            ws.onerror = (e) => console.warn('WS 錯誤:', e);
            ws.onmessage = (ev) => {
                let msg;
                try { msg = JSON.parse(ev.data); } catch (e) { return; }
                handleServerMessage(msg);
            };
        }

        function handleServerMessage(msg) {
            switch (msg.type) {
                case 'transcript':               // 語音輸入的逐字稿（階段五才會用到）
                    if (msg.text) inputField.value = msg.text;
                    break;
                case 'reply':
                    dialogBox.style.display = 'block';
                    dialogBox.innerText = msg.text || '（沉默）';
                    triggerEmotionAction(msg.emotion);
                    break;
                case 'audio':
                    enqueueAudio(msg);
                    break;
                case 'turn_end':
                    sendBtn.disabled = false;
                    break;
                case 'stopped':                  // 被打斷：清掉還沒播的語音
                    stopAllAudio();
                    sendBtn.disabled = false;
                    break;
            }
        }

        // ── 語音播放佇列：嚴格依 seq 順序播放 ──────────────────────────
        // 後端目前只送一段（seq 0），但任務八會平行合成、依序送多段；佇列
        // 依 seq 排序、缺號時等待，確保句子 2 一定在句子 3 之前播出。
        const audioQueue = [];    // 待播的 {seq, base64}
        let expectedSeq = 0;      // 下一個該播的 seq
        let playing = false;

        function resetAudioQueue() {
            audioQueue.length = 0;
            expectedSeq = 0;
            playing = false;
        }

        function enqueueAudio(msg) {
            audioQueue.push(msg);
            audioQueue.sort((a, b) => a.seq - b.seq);
            pumpAudio();
        }

        function pumpAudio() {
            if (playing) return;
            const next = audioQueue[0];
            if (!next || next.seq !== expectedSeq) return;  // 等缺號的那段到齊
            audioQueue.shift();
            playing = true;
            playSegment(next.base64, () => {
                playing = false;
                expectedSeq += 1;
                pumpAudio();
            });
        }

        // 用引擎內建的 speak() 播放單段語音並自動對嘴（會在正確時機驅動
        // model3.json 的 LipSync 群組 → ParamMouthOpenY，避免被每幀 update 蓋掉）。
        // 需要 @pixi/sound 已載入。
        function playSegment(base64Wav, onDone) {
            if (!live2dModel || typeof live2dModel.speak !== 'function') { onDone(); return; }

            const binary = atob(base64Wav);
            const bytes = new Uint8Array(binary.length);
            for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
            const blob = new Blob([bytes], { type: 'audio/wav' });
            const url = URL.createObjectURL(blob);
            currentAudioUrl = url;

            try {
                live2dModel.speak(url, {
                    volume: 1.0,
                    onFinish: () => { URL.revokeObjectURL(url); if (currentAudioUrl === url) currentAudioUrl = null; onDone(); },
                    onError: (e) => { console.warn('speak 失敗:', e); URL.revokeObjectURL(url); onDone(); },
                });
            } catch (err) {
                // speak() 偶爾會同步丟例外（音檔解碼失敗等）；別讓佇列卡死。
                console.error('speak() 例外:', err);
                URL.revokeObjectURL(url);
                onDone();
            }
        }

        function stopAllAudio() {
            resetAudioQueue();
            try { if (live2dModel && typeof live2dModel.stopSpeaking === 'function') live2dModel.stopSpeaking(); } catch (e) {}
            if (currentAudioUrl) { URL.revokeObjectURL(currentAudioUrl); currentAudioUrl = null; }
        }

        // 喚醒被瀏覽器 autoplay 政策擋住的音訊環境（@pixi/sound 的 AudioContext）。
        // 冷啟動時 AudioContext 預設是 suspended，不喚醒的話第一句話沒聲音、得靠
        // Ctrl+R 重載才會解鎖。resume() 必須在使用者手勢的呼叫堆疊內執行才有效，
        // 所以由送訊息／首次互動觸發。
        function resumeAudioContext() {
            try {
                const s = window.PIXI && PIXI.sound;
                const ctx = s && s.context && (s.context.audioContext || s.context._ctx);
                if (ctx && ctx.state === 'suspended' && typeof ctx.resume === 'function') {
                    ctx.resume().catch(() => {});
                }
            } catch (e) {}
        }

        // 備援：任何第一次互動都嘗試解鎖一次（涵蓋之後的麥克風按鈕等入口）。
        function unlockAudioOnce() {
            resumeAudioContext();
            window.removeEventListener('pointerdown', unlockAudioOnce);
            window.removeEventListener('keydown', unlockAudioOnce);
        }
        window.addEventListener('pointerdown', unlockAudioOnce);
        window.addEventListener('keydown', unlockAudioOnce);

        function sendMessage() {
            const text = inputField.value.trim();
            if (!text) return;

            if (!wsReady) {
                dialogBox.style.display = 'block';
                dialogBox.innerText = '連線中…請確認後端有在執行';
                return;
            }

            resumeAudioContext();  // 趁這次點擊/Enter 的手勢，先確保音訊環境已解鎖
            inputField.value = '';
            sendBtn.disabled = true;
            dialogBox.style.display = 'block';
            dialogBox.innerText = '思考中...';

            stopAllAudio();  // 開始新一輪，先清掉上一輪殘留的語音
            ws.send(JSON.stringify({ type: 'text', text }));
        }
        
        function triggerEmotionAction(emotion) {
            if (!live2dModel) return;
            console.log("接收到大腦情緒:", emotion);
            
            switch(emotion) {
                case "happy":
                    live2dModel.expression("happy");
                    break;
                case "sad":
                    live2dModel.expression("sad");
                    break;
                case "surprised":
                    live2dModel.expression("surprised");
                    break;
                default:
                    live2dModel.expression(); // 恢復預設
                    break;
            }
        }

        sendBtn.addEventListener('click', sendMessage);
        inputField.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });

        window.onload = () => { init(); connectWS(); };
    </script>
</body>
</html>
