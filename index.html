<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>AI Butler Vision Container</title>
    <style>
        body { margin: 0; background: transparent; overflow: hidden; font-family: "Microsoft JhengHei", sans-serif; }
        canvas { display: block; width: 100vw; height: 100vh; position: absolute; z-index: 1; }
        #drag-zone { position: absolute; top: 0; left: 0; width: 100vw; height: calc(100vh - 100px); z-index: 5; -webkit-app-region: drag; }
        #chat-container { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 10; display: flex; flex-direction: column; align-items: center; width: 80%; }
        #dialogue-box { background: rgba(0, 0, 0, 0.6); color: white; padding: 15px; border-radius: 10px; margin-bottom: 10px; width: 100%; text-align: center; font-size: 16px; display: none; text-shadow: 1px 1px 2px black; }
        #input-area { display: flex; width: 100%; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        #user-input { flex-grow: 1; padding: 10px; border-radius: 5px 0 0 5px; border: none; outline: none; background: rgba(255, 255, 255, 0.9); }
        #send-btn { padding: 10px 20px; border: none; background: #ff7675; color: white; font-weight: bold; border-radius: 0 5px 5px 0; cursor: pointer; transition: background 0.2s; }
        #send-btn:hover { background: #d63031; }
    </style>
</head>
<body>
    <div id="drag-zone"></div>
    
    <script src="pixi.v8.min.js"></script>
    <script src="pixi-sound.min.js"></script>
    <script src="live2dcubismcore.min.js"></script>
    <script src="live2d-engine.min.js"></script>
    
    <div id="chat-container">
        <div id="dialogue-box"></div>
        <div id="input-area">
            <input type="text" id="user-input" placeholder="說點什麼吧..." autocomplete="off">
            <button id="send-btn">發送</button>
        </div>
    </div>

    <script>
        const Live2DModel = window.PIXI?.live2d?.Live2DModel || window.Live2DModel;
        let live2dModel = null;

        // 可即時調整的鏡頭參數。zoom：相對「完整入鏡」的倍數（1=整個模型剛好入鏡，
        // 放大看臉可用 2~3）；x/y：模型在畫面上的位置(0..1)。
        // 除錯時可在 DevTools Console 直接呼叫：frameModel({ zoom: 2.5, y: 0.9 })
        let fitScale = 1;
        const camera = { zoom: 2.5, x: 0.5, y: 1 };   // 日常預設：上半身特寫

        function applyCamera() {
            if (!live2dModel) return;
            live2dModel.anchor.set(0.5, 0.5);
            live2dModel.scale.set(1);
            fitScale = Math.min(window.innerWidth / live2dModel.width,
                                window.innerHeight / live2dModel.height) * 0.95;
            live2dModel.scale.set(fitScale * camera.zoom);
            live2dModel.x = window.innerWidth * camera.x;
            live2dModel.y = window.innerHeight * camera.y;
        }
        window.frameModel = (opts = {}) => {
            Object.assign(camera, opts);
            applyCamera();
            console.log('camera=', JSON.stringify(camera));
        };

        // 凝視方向，直接餵 focusController 的正規化座標 [-1,1]，與視窗大小/位置無關。
        // (0,0)=中性；nx 正=右、ny 正=下。除錯時可在 Console 呼叫：lookAt(0.3, 0.2)
        const gaze = { nx: 0, ny: 0 };
        window.lookAt = (nx = 0, ny = 0) => {
            gaze.nx = nx; gaze.ny = ny;
            const fc = live2dModel && live2dModel.internalModel && live2dModel.internalModel.focusController;
            if (!fc || typeof fc.focus !== 'function') {
                console.warn('focusController.focus 不存在，無法調整凝視');
                return;
            }
            fc.focus(nx, ny);
            console.log('gaze=', JSON.stringify(gaze));
        };

        async function init() {
            if (!Live2DModel) return;

            // PixiJS v8: Application options go to init(), which is async.
            const app = new PIXI.Application();
            await app.init({ resizeTo: window, backgroundAlpha: 0, antialias: true });
            document.body.appendChild(app.canvas);

            try {
                // untitled-pixi-live2d-engine auto-enables high-precision masks,
                // so this Cubism 5 model's 20+ clipping masks render correctly.
                const modelPath = "./model/Furina/furina.model3.json";
                live2dModel = await Live2DModel.from(modelPath);
                app.stage.addChild(live2dModel);

                // 徹底關閉模型的滑鼠互動與視線追蹤（引擎若無此屬性則略過）
                try { live2dModel.autoInteract = false; } catch (e) {}

                // 完整入鏡（fit-to-view），確保臉不會被切掉
                applyCamera();
                window.addEventListener('resize', applyCamera);

                // 凝視方向（可用 Console 的 lookAt(nx, ny) 即時調整）
                window.lookAt(gaze.nx, gaze.ny);

            } catch (e) {
                console.error("模型加載失敗:", e);
                dialogBox.style.display = 'block';
                dialogBox.innerText = "模型載入失敗：" + (e && e.stack ? e.stack : (e && e.message ? e.message : e));
            }
        }
        
        const inputField = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');
        const dialogBox = document.getElementById('dialogue-box');

        let currentAudioUrl = null;

        // 用引擎內建的 speak() 播放語音並自動對嘴（會在正確時機驅動
        // model3.json 的 LipSync 群組 → ParamMouthOpenY，避免被每幀 update 蓋掉）。
        // 需要 @pixi/sound 已載入。
        function playVoice(base64Wav) {
            if (!live2dModel || typeof live2dModel.speak !== 'function') return;

            const binary = atob(base64Wav);
            const bytes = new Uint8Array(binary.length);
            for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
            const blob = new Blob([bytes], { type: 'audio/wav' });

            if (currentAudioUrl) URL.revokeObjectURL(currentAudioUrl);
            currentAudioUrl = URL.createObjectURL(blob);

            live2dModel.speak(currentAudioUrl, {
                volume: 1.0,
                onFinish: () => { if (currentAudioUrl) { URL.revokeObjectURL(currentAudioUrl); currentAudioUrl = null; } },
                onError: (e) => console.warn("speak 失敗:", e),
            });
        }

        async function sendMessage() {
            const text = inputField.value.trim();
            if (!text) return;

            inputField.value = '';
            sendBtn.disabled = true;
            dialogBox.style.display = 'block';
            dialogBox.innerText = "思考中...";

            try {
                const response = await fetch('http://127.0.0.1:8000/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: text })
                });

                if (!response.ok) {
                    throw new Error(`伺服器錯誤 ${response.status}`);
                }

                const data = await response.json();

                dialogBox.innerText = data.reply || "（沉默）";
                triggerEmotionAction(data.emotion);

                if (data.audio_base64 && live2dModel) {
                    playVoice(data.audio_base64);
                }

            } catch (error) {
                console.error("發送失敗:", error);
                dialogBox.innerText = "連不上後端，請確認 server.py 有在執行。";
            } finally {
                sendBtn.disabled = false;
            }
        }
        
        function triggerEmotionAction(emotion) {
            if (!live2dModel) return;
            console.log("接收到大腦情緒:", emotion);
            
            switch(emotion) {
                case "happy":
                    live2dModel.expression("happy");
                    break;
                case "sad":
                    live2dModel.expression("sad");
                    break;
                case "surprised":
                    live2dModel.expression("surprised");
                    break;
                default:
                    live2dModel.expression(); // 恢復預設
                    break;
            }
        }

        sendBtn.addEventListener('click', sendMessage);
        inputField.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });

        window.onload = init;
    </script>
</body>
</html>
